<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Favorite Animals</title>
    <script src="JavaScript_3.js" defer></script>
</head>
<body>
    <h1>My Favorite Animals</h1>
    <p>Click an animal to learn its habitat.</p>

    <ul>
        <li onclick="showHabitat(this)"
            data-habitat="the ocean">Dolphin</li>
        <li onclick="showHabitat(this)"
            data-habitat="the forest">Deer</li>
        <li onclick="showHabitat(this)"
            data-habitat="the desert">Camel</li>
    </ul>
</body>
</html>
