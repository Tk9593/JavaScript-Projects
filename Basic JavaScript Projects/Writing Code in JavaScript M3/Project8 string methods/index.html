<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project8 String Methods</title>
    <script src="JS/main.js" defer></script>
</head>
<body>
    <h1>JavaScript String Methods</h1>

    <!-- Join strings with concat(). -->
    <button onclick="join_Strings()">Join Strings</button>
    <p id="Joined_Text"></p>
    <hr>

    <!-- Extract part of a string with slice(). -->
    <button onclick="slice_String()">Slice String</button>
    <p id="Slice_Result"></p>
    <hr>

    <!-- Convert text to uppercase. -->
    <button onclick="uppercase_String()">Convert to Uppercase</button>
    <p id="Uppercase_Result"></p>
    <hr>

    <!-- Find the starting position of a matching word. -->
    <button onclick="search_String()">Search for JavaScript</button>
    <p id="Search_Result"></p>
    <hr>

    <!-- Convert a number into a string. -->
    <button onclick="number_To_String()">Convert Number to String</button>
    <p id="String_Result"></p>
    <hr>

    <!-- Format a number with five significant digits. -->
    <button onclick="precision_Method()">Show Precision</button>
    <p id="Precision_Result"></p>
</body>
</html>
