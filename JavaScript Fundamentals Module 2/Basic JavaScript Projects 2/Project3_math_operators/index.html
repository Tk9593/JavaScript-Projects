<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Operators</title>

    <!-- Link to the JavaScript file -->
    <script src="JS/main.js" defer></script>
</head>

<body>
    <h1>JavaScript Math Operators</h1>
    <p>Click each line to display its result.</p>
    <hr>

    <!-- Each paragraph calls its own JavaScript function -->
    <p id="Add" onclick="addition()">Addition</p>

    <p id="Sub" onclick="subtraction()">Subtraction</p>

    <p id="Mlt" onclick="multiplication()">Multiplication</p>

    <p id="Div" onclick="division()">Division</p>

    <p id="Multiple" onclick="multiple_operations()">Multiple Operators</p>

    <p id="Mod" onclick="modulus_operator()">Modulus</p>

    <p id="Neg" onclick="negation_operator()">Negation</p>

    <p id="IncrementText" onclick="increment()">Increment: 0</p>

    <p id="DecrementText" onclick="decrement()">Decrement: 0</p>

    <p id="Ran" onclick="random_number()">Random Number</p>

    <p id="SquareRoot" onclick="square_root()">Square Root</p>
</body>
</html>
